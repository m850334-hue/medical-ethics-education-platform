<div class="hero"><div>B4｜基礎微課程</div><h1>身體隱私與照護尊嚴｜課後測驗</h1><p>一般學習選答即時解析；正式測驗全部作答後提交。</p><a href="course-b4-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 B4 課程</a></div>
<main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"下列何者最符合「身體隱私」的概念？","o":["病人在檢查、治療或照護時，對身體暴露與被觀看的尊重","只限於病歷資料保密","只與手術有關","只在病人主動抱怨時才需注意"],"a":0,"e":"正確答案為（A）。身體隱私是照護中避免不必要暴露，並維護病人的尊嚴與安全感。"},{"q":"在多人病房為病人導尿，下列何者較適當？","o":["動作快就好，不必拉簾","因大家都在病房，不需遮蔽","確實拉簾、減少非必要人員在場，並先向病人說明","在鄰床前大聲說明病情"],"a":2,"e":"正確答案為（C）。進行暴露身體的處置前，應先說明、遮蔽並只暴露必要部位。"},{"q":"檢查或照護前先向病人說明，主要目的為何？","o":["增加流程複雜度","讓病人有心理準備並感受到被尊重","避免所有醫療處置","讓病人不能提問"],"a":1,"e":"正確答案為（B）。事前說明可讓病人了解接下來的處置、做好心理準備，並感受到尊重。"},{"q":"轉送病人途中發現被單未妥善遮蔽、身體部分暴露。較適當的處理是？","o":["趕時間，先不處理","到目的地再說","請病人自己處理","立即妥善遮蔽再轉送，並注意走廊動線"],"a":3,"e":"正確答案為（D）。發現病人身體暴露時，應立即妥善遮蔽後再轉送，避免持續暴露。"},{"q":"關於身體隱私與照護尊嚴，下列何者正確？","o":["只由護理人員負責","只在特殊檢查時才需注意","是全體照護與服務流程都可能影響的基本要求","忙碌時可以完全忽略"],"a":2,"e":"正確答案為（C）。尊重的稱呼、語氣與解釋方式，和遮蔽措施同樣是照護尊嚴的一部分。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

</script>
