<!doctype html>
<html lang="zh-Hant">
<style data-site-identity-style>
.site-identity{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 5vw;background:#fff;border-bottom:1px solid #dbe5ec;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.site-identity-brand{display:flex;flex-direction:column;gap:2px;line-height:1.35}.site-identity-owner{color:#286d69;font-size:1.12rem;font-weight:800}.site-identity-platform{color:#17324d;font-size:1.35rem;font-weight:800}.site-identity-home{flex:0 0 auto;color:#286d69;font-size:1rem;font-weight:700;text-decoration:none}.site-identity-home:hover{text-decoration:underline}@media(max-width:600px){.site-identity{align-items:flex-start;padding:13px 20px;gap:12px}.site-identity-owner{font-size:1rem}.site-identity-platform{font-size:1.15rem}.site-identity-home{font-size:.92rem;padding-top:3px}}
</style>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一頁式資訊圖｜醫學倫理教學平台</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--ink:#162b46;--muted:#526a82;--teal:#347c78;--teal-dark:#245f5c;--line:#d8e3eb;--soft:#eef7f6;--page:#f4f7f9}
    *{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 5vw;background:#fff;border-bottom:1px solid var(--line)}
    .brand{font-weight:800;color:var(--ink);text-decoration:none}.back{color:var(--teal-dark);font-weight:700;text-decoration:none}
    .hero{padding:48px 5vw 42px;background:#fff;border-bottom:1px solid var(--line)}
    .hero-inner,.content{max-width:1240px;margin:auto}.eyebrow{color:var(--teal);font-weight:800;letter-spacing:.12em}
    h1{font-size:clamp(2rem,4vw,3.35rem);margin:10px 0 14px}.lead{max-width:760px;color:var(--muted);font-size:1.08rem;line-height:1.8}
    .content{padding:30px 24px 56px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
    .filter{border:1px solid #b9d2d3;border-radius:999px;background:#fff;color:var(--teal-dark);padding:10px 17px;font-weight:800;cursor:pointer}
    .filter[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}.filter:focus-visible,.action:focus-visible,.close:focus-visible{outline:3px solid #8dc7c2;outline-offset:2px}
    .series-note{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--soft);border:1px solid #cfe2e1;border-radius:14px;padding:18px 20px;margin-bottom:28px}
    .series-note strong{font-size:1.08rem}.series-note span{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
    .info-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(31,54,78,.05)}
    .thumb{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;background:#e8efef;border:0;border-bottom:1px solid var(--line);cursor:pointer}
    .card-body{padding:15px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.code{color:var(--teal);font-weight:900;letter-spacing:.08em}.card-body h2{font-size:1.08rem;line-height:1.5;margin:0;flex:1}.mini-actions{display:flex;align-items:center;gap:6px}.mini-action{border:1px solid #b9d2d3;border-radius:7px;background:#fff;color:var(--teal-dark);cursor:pointer;font-size:.78rem;font-weight:800;line-height:1;padding:7px 9px;text-decoration:none;white-space:nowrap}.mini-action.primary{background:var(--teal);border-color:var(--teal);color:#fff}.mini-action:hover{border-color:var(--teal-dark)}.mini-action.primary:hover{background:var(--teal-dark)}
    dialog{width:min(1000px,94vw);max-height:94vh;border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px rgba(18,39,60,.28)}dialog::backdrop{background:rgba(14,31,48,.76)}
    .dialog-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px}.dialog-head strong{line-height:1.4}
    .close{border:0;border-radius:8px;background:var(--soft);color:var(--teal-dark);font-size:1rem;font-weight:900;padding:9px 13px;cursor:pointer}.full-image{display:block;width:100%;height:auto;background:#fff}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:740px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.series-note{align-items:flex-start;flex-direction:column}.content{padding-inline:16px}}
    @media(max-width:480px){.grid{grid-template-columns:1fr}.topbar{padding-inline:18px}.hero{padding-inline:20px}}
  </style>
</head>
<body>
<header class="site-identity">
  <div class="site-identity-brand">
    <span class="site-identity-owner">奇美醫院醫學倫理委員會</span>
    <span class="site-identity-platform">醫學倫理微課程教育平台</span>
  </div>
  <a class="site-identity-home" href="index.html">返回首頁</a>
</header>
  
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">INFOGRAPHICS</div>
      <h1>一頁式資訊圖</h1>
      <p class="lead">用一張圖快速複習每集課程的臨床情境與核心訊息。可依課程群組篩選，點選後放大閱讀。</p>
    </div>
  </header>
  <main class="content">
    <div class="series-note">
      <div><strong>第一系列｜基礎微課程</strong><br><span>收錄 16 張一頁式資訊圖</span></div>
      <div><strong>第二系列｜臨床倫理情境案例</strong><br><span>收錄 18 張一頁式資訊圖</span></div>
    </div>
    <div class="controls" aria-label="課程群組篩選">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">全部 34 集</button>
      <button class="filter" type="button" data-filter="series1" aria-pressed="false">第一系列｜16 集</button>
      <button class="filter" type="button" data-filter="series2" aria-pressed="false">第二系列｜18 集</button>
      <button class="filter" type="button" data-filter="A" aria-pressed="false">A｜倫理基礎</button>
      <button class="filter" type="button" data-filter="B" aria-pressed="false">B｜病人權利</button>
      <button class="filter" type="button" data-filter="C" aria-pressed="false">C｜臨床溝通</button>
      <button class="filter" type="button" data-filter="D" aria-pressed="false">D｜隱私情境</button>
      <button class="filter" type="button" data-filter="E" aria-pressed="false">E｜臨床倫理情境</button>
    </div>
    <section class="grid" id="gallery" aria-label="第一系列與第二系列一頁式資訊圖"></section>
  </main>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="dialog-head"><strong id="viewer-title"></strong><button class="close" type="button">關閉</button></div>
    <img class="full-image" id="viewer-image" alt="">
  </dialog>

  <script src="assets/platform-analytics.js?v=20260923g"></script>
  <script>
    const items=[
      ['A1','醫學倫理不是只有法律問題','assets/infographics/infor-A1.png','series1'],['A2','醫學倫理四大原則','assets/infographics/infor-A2.png','series1'],['A3','病人最佳利益與代理決定','assets/infographics/infor-A3.png','series1'],['A4','遇到倫理困境時，臨床團隊如何整理問題？','assets/infographics/infor-A4.png','series1'],
      ['B1','病人權利是什麼？','assets/infographics/infor-B1.png','series1'],['B2','尊重病人自主與知情同意','assets/infographics/infor-B2.png','series1'],['B3','病人隱私、保密與資訊揭露','assets/infographics/infor-B3.png','series1'],['B4','身體隱私與照護尊嚴','assets/infographics/infor-B4.png','series1'],
      ['C1','病人拒絕治療時，醫療團隊可以怎麼做？','assets/infographics/infor-C1.png','series1'],['C2','當病人、家屬與醫療團隊意見不一致時','assets/infographics/infor-C2.png','series1'],['C3','治療效益有限時，如何與家屬討論照護目標？','assets/infographics/infor-C3.png','series1'],['C4','醫療團隊內部意見不同時，如何進行倫理討論？','assets/infographics/infor-C4.png','series1'],
      ['D1','家屬要求不要告訴病人病情，怎麼辦？','assets/infographics/infor-D1.png','series1'],['D2','家屬來電詢問病情，可以直接告知嗎？','assets/infographics/infor-D2.png','series1'],['D3','拍照、錄影與病人隱私','assets/infographics/infor-D3.png','series1'],['D4','教學簡報使用病人照片或案例，要注意什麼？','assets/infographics/infor-D4.png','series1'],
      ['E1','讓病人真正參與醫療決策','assets/series2/E1/E1-讓病人真正參與醫療決策_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E2','知情同意，不只是簽名','assets/series2/E2/E2-知情同意不只是簽名_一頁式資訊圖_橫式16x9_新架構_v4.png','series2'],
      ['E3','病人說：「都交給醫師決定。」','assets/series2/E3/E3-病人說都交給醫師決定_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E4','當家屬希望暫時不要告知病人','assets/series2/E4/E4-當家屬希望暫時不要告知病人_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E5','病人拒絕侵入性處置，怎麼回應？','assets/series2/E5/E5-病人拒絕侵入性處置怎麼回應_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E6','病房走廊談病情，可以嗎？','assets/series2/E6/E6-病房走廊談病情可以嗎_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E7','電話詢問病情，可以直接說嗎？','assets/series2/E7/E7-電話詢問病情可以直接說嗎_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E8','病人與家屬意見不同，該聽誰的？','assets/series2/E8/E8-病人與家屬意見不同該聽誰的_一頁式資訊圖_橫式16x9_新架構_v3.png','series2'],
      ['E9','病人拒絕住院，怎麼辦？','assets/series2/E9/E9-病人拒絕住院怎麼辦_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E10','病人說：「我真的不能再住了。」','assets/series2/E10/E10-病人說我真的不能再住了_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E11','家屬彼此意見不同，醫療團隊怎麼辦？','assets/series2/E11/E11-家屬彼此意見不同醫療團隊怎麼辦_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E12','忙碌時，可以省略說明嗎？','assets/series2/E12/E12-忙碌時可以省略說明嗎_一頁式資訊圖_橫式16x9_新架構_v3.png','series2'],
      ['E13','用通訊軟體傳送病人資料，可以嗎？','assets/series2/E13/E13-用通訊軟體傳送病人資料可以嗎_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E14','醫療團隊意見不同，病人該聽誰的？','assets/series2/E14/E14-醫療團隊意見不同病人該聽誰的_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E15','什麼時候需要倫理諮詢？','assets/series2/E15/E15-什麼時候需要倫理諮詢_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E16','遇到倫理困境，第一步是什麼？','assets/series2/E16/E16-遇到倫理困境第一步是什麼_一頁式資訊圖_橫式16x9_新架構_v1.png','series2'],
      ['E17','每個方案都有風險，該怎麼選？','assets/series2/E17/E17-每個方案都有風險該怎麼選_一頁式資訊圖_橫式16x9_新架構_v2.png','series2'],
      ['E18','倫理決定如何落實在照護中？','assets/series2/E18/E18-倫理決定如何落實在照護中_一頁式資訊圖_橫式16x9_新架構_v1.png','series2']
    ];
    const gallery=document.getElementById('gallery');
    const viewer=document.getElementById('viewer');
    const viewerImage=document.getElementById('viewer-image');
    const viewerTitle=document.getElementById('viewer-title');
    function render(filter='all'){
      const visible=items.filter(([code,,path,series])=>filter==='all'||filter===series||code.startsWith(filter));
      gallery.innerHTML=visible.map(([code,title,path,series])=>`<article class="info-card"><button class="thumb-button" type="button" data-file="${path}" data-title="${code}｜${title}" aria-label="放大閱讀 ${code} ${title}" style="padding:0;border:0;background:transparent"><img class="thumb" loading="lazy" src="${path}" alt="${code} ${title} 一頁式資訊圖縮圖"></button><div class="card-body"><div class="card-top"><div class="code">${code}｜${series==='series1'?'第一系列':'第二系列'}</div><div class="mini-actions"><button class="mini-action primary" type="button" data-file="${path}" data-title="${code}｜${title}" aria-label="放大閱讀 ${code} ${title}">放大閱讀</button></div></div><h2>${title}</h2></div></article>`).join('');
    }
    document.querySelector('.controls').addEventListener('click',event=>{const button=event.target.closest('.filter');if(!button)return;document.querySelectorAll('.filter').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));render(button.dataset.filter)});
    gallery.addEventListener('click',event=>{const button=event.target.closest('[data-file]');if(!button)return;const code=button.dataset.title.split('｜')[0];const item=items.find(row=>row[0]===code);PlatformAnalytics.track('infographic_open',{course_id:code,series_id:item?.[3]||'unknown'});viewerTitle.textContent=button.dataset.title;viewerImage.src=button.dataset.file;viewerImage.alt=button.dataset.title+' 一頁式資訊圖';viewer.showModal()});
    viewer.querySelector('.close').addEventListener('click',()=>viewer.close());
    viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});
    render();
  </script>
</body>
</html>
