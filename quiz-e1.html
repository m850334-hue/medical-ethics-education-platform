<div class="hero"><div>E1｜第二系列・臨床倫理情境案例</div><h1>讓病人真正參與醫療決策｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e1-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E1 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"王女士案例中，最主要的倫理重點為何？","o":["家屬不得陪同病人看診","病人應自行決定所有治療","應讓仍能理解與表達的病人參與醫療決策","醫師只能聽取家屬提供的資訊"],"a":2,"e":"正確答案為（C）。病人參與的核心不是排除家屬，也不是要求病人獨自完成所有決定，而是讓仍具有理解與表達能力的病人，有機會表達價值與意願，並參與與自己有關的醫療決策。"},{"q":"面對女兒主動代為回答，醫師較適當的第一步為何？","o":["立即制止女兒發言","請女兒離開診間","只接受女兒提供的資訊","先肯定女兒的說明，再邀請病人表達"],"a":3,"e":"正確答案為（D）。家屬提供的資訊可能具有重要價值，不必立刻否定或排除。先肯定家屬，再直接邀請病人表達，能同時維持合作關係與病人的參與空間。"},{"q":"下列何者最符合病人參與醫療決策的精神？","o":["所有決定都由病人單獨完成","病人只需要接受醫師的專業建議","將病人的價值與意願納入共同討論","家屬比病人更了解病情，因此由家屬決定"],"a":2,"e":"正確答案為（C）。病人參與不是把所有責任交給病人，也不是只接受專業建議；而是把醫療資訊、病人的價值與意願，以及家屬能提供的補充資訊，一起納入共同討論。"},{"q":"當病人仍具有理解與表達能力時，醫療團隊較適當的作法為何？","o":["只與主要照顧者討論","優先聽取病人的想法，再整合家屬資訊","為節省時間，由家屬統一回答","避免詢問病人的擔憂，以免增加焦慮"],"a":1,"e":"正確答案為（B）。病人仍能理解與表達時，應優先為病人保留說話與參與的機會，再整合家屬的觀察與補充資訊。這不等於忽略家屬，而是維持適當的參與順序。"},{"q":"若你是案例中的醫師，下列哪一句話最適當？","o":["「請您先不要說，讓病人自己回答。」","「既然女兒比較清楚，就由女兒決定。」","「謝謝您的說明，我也想聽聽王女士自己的想法。」","「王女士年紀大了，應該不容易理解。」"],"a":2,"e":"正確答案為（C）。此回應先肯定家屬的協助，再主動邀請病人表達，不會製造對立，也不會因年齡而預設病人無法理解，最能體現尊重自主與共同參與。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

<script>
(()=>{if(!window.PlatformAnalytics)return;let generalRecorded=false,formalRecorded=false;const list=document.getElementById('list'),general=document.getElementById('l'),formal=document.getElementById('f');const record=mode=>PlatformAnalytics.track('quiz_complete',{course_id:'E1',series_id:'series_2',mode});list?.addEventListener('change',event=>{if(!event.target.matches('input[type=radio]'))return;if(window.formal&&!formalRecorded){formalRecorded=true;record('正式測驗')}else if(!window.formal&&!generalRecorded){generalRecorded=true;record('一般學習')}});general?.addEventListener('click',()=>{generalRecorded=false});formal?.addEventListener('click',()=>{formalRecorded=false});})();
</script>
