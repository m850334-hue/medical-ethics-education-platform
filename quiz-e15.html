<div class="hero"><div>E15｜第二系列・臨床倫理情境案例</div><h1>什麼時候需要倫理諮詢？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e15-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E15 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"陳先生目前無法穩定表達意願，家屬與醫療團隊對是否放置鼻胃管多次討論後仍無法釐清。下列何者最能說明此時可以考慮倫理諮詢的理由？","o":["只要病人無法表達，就一定必須申請倫理諮詢。","請倫理諮詢人員直接替家屬作決定。","病人意願、治療利益與負擔仍有重要不確定性。","請倫理諮詢提供法律判決。"],"a":2,"e":"正確答案為（C）。本案經過溝通後，病人的意願、鼻胃管的利益與負擔，以及代理決策的依據仍未釐清，因此適合透過倫理諮詢協助整理問題、資訊與價值。倫理諮詢不是所有無法表達病人的必要程序，也不會代替家屬決定或提供法律判決。"},{"q":"陳先生曾說：「我不希望以後一直靠管子維持。」下列哪一種理解較合宜？","o":["這就是正式的預立醫療決定，代表拒絕所有管路。","這是重要的價值與意願線索，但仍需結合情境進一步釐清。","因為病人目前無法表達，所以這句話沒有參考價值。","只要家屬同意，就不必再考慮病人過去的表達。"],"a":1,"e":"正確答案為（B）。病人過去的口頭表達是了解其價值與意願的重要線索，但若未清楚說明適用的治療及情境，不能直接等同正式預立醫療決定，也不宜一概解讀為拒絕所有管路。團隊仍應結合病人過去的生活經驗、價值觀、其他相關表達及目前病情加以釐清。"},{"q":"下列何者最符合臨床倫理諮詢可以提供的協助？","o":["判定醫療團隊與家屬哪一方正確。","釐清倫理問題、整理資訊與價值，並促進對話。","直接決定是否為病人放置鼻胃管。","代表醫院宣布最終處置。"],"a":1,"e":"正確答案為（B）。倫理諮詢的功能是協助釐清問題、整理病情與病人意願、辨識不同價值，並促進病人、家屬與醫療團隊之間的對話。它不是裁判，也不會直接作出醫療決定或代表醫院宣布最終處置。"},{"q":"關於倫理諮詢，下列敘述何者錯誤？","o":["不必等到衝突失控後才提出。","團隊出現持續的道德困擾時，也可考慮尋求協助。","申請倫理諮詢後，原醫療團隊的照護責任即告結束。","倫理諮詢不能取代必要的法律或行政程序。"],"a":2,"e":"正確答案為（C）。倫理諮詢可以及早提出，團隊持續出現道德困擾也可能是適當的求助時機。然而，提出倫理諮詢不代表原醫療團隊的照護責任結束；原團隊仍須持續照護、溝通並參與決策。倫理諮詢也不能取代必要的法律或行政程序。"},{"q":"完成倫理諮詢後，最終的醫療決策應由誰作出？","o":["倫理諮詢人員。","倫理委員會以多數決決定。","適當的決策者在充分知情與討論後作出。","最先提出倫理諮詢的人。"],"a":2,"e":"正確答案為（C）。倫理諮詢提供分析、溝通與建議，不接管決定。最終仍應由依法及依臨床情境適當的決策者，在充分了解病情、病人意願、各方案利益與負擔，並完成必要討論後作出決定。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

(()=>{if(!window.PlatformAnalytics)return;PlatformAnalytics.track('quiz_complete',{course_id:'E15',series_id:'series_2',mode:'一般學習'});const formal=document.getElementById('f');formal?.addEventListener('click',()=>PlatformAnalytics.track('quiz_complete',{course_id:'E15',series_id:'series_2',mode:'正式測驗'}));})();
</script>
