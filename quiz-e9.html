<div class="hero"><div>E9｜第二系列・臨床倫理情境案例</div><h1>病人拒絕住院，怎麼辦？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e9-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E9 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"75 歲王先生因肺炎合併低血氧至急診，醫師建議住院治療。王先生回答問題切題，也能說明自己想返家的理由。此時醫療團隊最優先應做的是什麼？","o":["立即請王先生簽署自動出院文件","請女兒代替王先生決定是否住院","評估王先生是否理解病情、治療建議及拒絕住院的後果","因病情可能惡化，直接限制王先生離院"],"a":2,"e":"正確答案為（C）。病人拒絕住院時，應先評估其能否理解資訊、權衡後果並清楚表達決定。"},{"q":"醫師進一步詢問後，王先生表示，他拒絕住院是因為家中失智的妻子平日由他照顧，擔心住院後無人照料。此時最適當的作法為何？","o":["告知家庭照顧問題不屬於醫療團隊的處理範圍","重複說明住院的必要性，直到王先生同意","與王先生及家屬討論替代照顧安排，必要時連結社工或其他資源","因王先生考量家庭因素，認定他無法做出理性決定"],"a":2,"e":"正確答案為（C）。理解並協助處理家庭照顧困難，才可能找到兼顧病人意願與安全的方案。"},{"q":"62 歲陳女士因膽囊炎被建議接受手術。她表示害怕麻醉後醒不來，因此拒絕手術。下列哪一項回應最適當？","o":["「這種手術很常見，您不用想太多。」","「不手術可能很危險，您現在就必須簽同意書。」","「可以請您說說最擔心的事情嗎？我們再一起了解麻醉風險及其他選擇。」","「既然您拒絕，我們就不再討論手術。」"],"a":2,"e":"正確答案為（C）。先理解具體恐懼，再說明風險、效益及選項，才能支持病人做出知情決定。"},{"q":"王先生經評估具有決策能力，醫療團隊也已說明肺炎可能惡化、住院治療的效益及返家的風險。王先生仍明確表示不願住院。此時最適當的處置為何？","o":["由女兒簽署住院同意書，強制安排住院","尊重王先生的知情決定，並提供返家用藥、警訊及後續追蹤說明","請王先生自行離院，不再提供任何醫療協助","持續要求王先生改變決定，否則不讓他離開"],"a":1,"e":"正確答案為（B）。尊重有能力病人的知情拒絕，也應持續提供安全衛教、返院警訊與後續追蹤。"},{"q":"另一位住院病人因感染突然出現意識混亂，無法說明目前病情，也無法理解離院可能造成的後果，卻反覆表示要立即回家。此時最適當的處理為何？","o":["只要病人表示要回家，就應立即讓他離院","先評估並處理可能影響決策能力的急性原因，再決定後續處置","直接請家屬簽署自動出院文件即可","為避免爭議，暫時不再向病人或家屬說明病情"],"a":1,"e":"正確答案為（B）。感染、低血氧或譫妄可能暫時影響能力，應先評估並處理原因，再判斷後續處置。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

(()=>{const submit=document.getElementById('submit'),result=document.getElementById('res');if(!submit||!result||!window.PlatformAnalytics)return;submit.addEventListener('click',()=>{if(!result.textContent.includes('尚未完成'))PlatformAnalytics.track('quiz_complete',{course_id:'E9',series_id:'series_2'});});})();
</script>
