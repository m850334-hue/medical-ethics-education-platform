<div class="hero"><div>E11｜第二系列・臨床倫理情境案例</div><h1>家屬彼此意見不同，醫療團隊怎麼辦？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e11-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E11 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"陳先生暫時無法表達醫療意願，長子與女兒對是否接受氣切意見不同。醫療團隊最適當的第一步為何？","o":["由長子直接決定，因為他在家中排行較長","請全體家屬投票，以多數決決定","先確認陳先生是否仍能以任何方式參與決策，並尋找其既有意願","由醫師直接決定，避免家屬繼續爭執"],"a":2,"e":"正確答案為（C）。應先確認病人能否參與；若不能，再尋找正式文件、過去表達與重要價值。"},{"q":"下列哪一項最不適合作為代理決策的主要依據？","o":["病人過去清楚表達的醫療偏好","病人長期重視的生活價值","哪一位家屬聲音最大、態度最堅持","各治療方案對病人的可能利益與負擔"],"a":2,"e":"正確答案為（C）。代理決策不是家屬權力競賽，應以病人的意願、價值與最佳利益為依據。"},{"q":"女兒表示父親過去曾說不希望長期依靠機器維持。醫療團隊接下來最適當的做法為何？","o":["立即認定父親一定拒絕所有治療","進一步了解父親當時談話的情境、清楚程度與一貫價值","因為沒有正式文件，所以完全不必考慮","只詢問其他家屬是否同意女兒的說法"],"a":1,"e":"正確答案為（B）。口頭表達是重要線索，但需釐清情境、明確程度及是否與長期價值一致。"},{"q":"長子與女兒各自說出真正的擔心後，醫療團隊發現雙方都希望父親獲得合適照護。這個步驟最主要的意義是什麼？","o":["證明兩位家屬其實沒有不同意見","找出哪一位家屬較有說服力","將表面立場轉化為可以共同討論的擔心與價值","要求家屬壓抑情緒，只討論醫療數據"],"a":2,"e":"正確答案為（C）。說出真正擔心，有助於把衝突從誰對誰錯轉回病人的價值與共同目標。"},{"q":"當病人的預後仍有不確定性、家屬暫時無法形成最終共識時，下列何者最符合本課程建議？","o":["無限期延續所有治療，暫時不再討論","立即停止治療，以避免家屬衝突","設定治療目標、觀察期間及再次討論的時間點，建立可重新評估的共同計畫","請家屬自行在院外協商，醫療團隊不再參與"],"a":2,"e":"正確答案為（C）。設定目標、觀察期與重評時間，可兼顧醫療不確定性、病人價值與家屬溝通。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

<script>
(()=>{if(!window.PlatformAnalytics)return;let generalRecorded=false,formalRecorded=false;const list=document.getElementById('list'),general=document.getElementById('l'),formal=document.getElementById('f');const record=mode=>PlatformAnalytics.track('quiz_complete',{course_id:'E11',series_id:'series_2',mode});list?.addEventListener('change',event=>{if(!event.target.matches('input[type=radio]'))return;if(formal?.classList.contains('active')&&!formalRecorded){formalRecorded=true;record('正式測驗')}else if(!formal?.classList.contains('active')&&!generalRecorded){generalRecorded=true;record('一般學習')}});general?.addEventListener('click',()=>{generalRecorded=false});formal?.addEventListener('click',()=>{formalRecorded=false});})();
</script>
