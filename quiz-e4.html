.site-identity{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 5vw;background:#fff;border-bottom:1px solid #dbe5ec;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}.site-identity-brand{display:flex;flex-direction:column;gap:2px;line-height:1.35}.site-identity-owner{color:#286d69;font-size:1.12rem;font-weight:800}.site-identity-platform{color:#17324d;font-size:1.35rem;font-weight:800}.site-identity-home{flex:0 0 auto;color:#286d69;font-size:1rem;font-weight:700;text-decoration:none}.site-identity-home:hover{text-decoration:underline}@media(max-width:600px){.site-identity{align-items:flex-start;padding:13px 20px;gap:12px}.site-identity-owner{font-size:1rem}.site-identity-platform{font-size:1.15rem}.site-identity-home{font-size:.92rem;padding-top:3px}}

<style>body{font-family:Arial,"Microsoft JhengHei";margin:0;background:#f4f8f8;color:#162b46}.hero{padding:30px 7%;background:#eef7f6}.wrap{max-width:900px;margin:25px auto}.mode button,#submit{padding:11px 18px;margin-right:8px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold}.active,#submit{background:#4f8e88!important;color:white!important}.q{background:white;border:1px solid #d7e2e8;border-radius:12px;padding:18px;margin:14px 0}.q.wrong{border:3px solid #c94b4b;background:#fff8f8}.opt{display:block;padding:8px}.exp{display:none;background:#eff8f5;border-left:4px solid #4f8e88;padding:10px;margin-top:10px}.fb{margin-top:8px;font-weight:bold}.result{display:none;background:white;border:2px solid #4f8e88;border-radius:10px;padding:18px;margin-top:20px}</style>
<style>@media(max-width:700px){.hero{padding:24px 20px}.wrap{margin:18px 14px}.mode{display:grid;gap:8px}.mode button,#submit{width:100%;margin:0}.q{padding:16px}.q h2{font-size:1.15rem;line-height:1.5}.opt{padding:11px 6px}}</style>

<body>
<header class="site-identity">
  <div class="site-identity-brand">
    <span class="site-identity-owner">奇美醫院醫學倫理委員會</span>
    <span class="site-identity-platform">醫學倫理微課程教育平台</span>
  </div>
  <a class="site-identity-home" href="index.html">返回首頁</a>
</header>
<div class="hero"><div>E4｜第二系列・臨床倫理情境案例</div><h1>當家屬希望暫時不要告知病人｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e4-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E4 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"家屬要求醫師不要告知病人病情時，醫師第一步最適合的是？","o":["立即答應家屬","立即告知病人","先了解家屬擔心的原因","請家屬離開"],"a":2,"e":"正確答案為（C）。先理解家屬真正擔心什麼，才能建立信任並開始後續的倫理對話。"},{"q":"本案例最主要的倫理議題為何？","o":["健保制度","病人知情權與家屬保護心態","醫療費用","病房管理"],"a":1,"e":"正確答案為（B）。核心是如何兼顧病人的知情與自主，以及家屬希望保護病人的心情。"},{"q":"下列何者較符合倫理溝通原則？","o":["完全依照家屬要求","完全忽略家屬意見","理解家屬並確認病人意願，再共同討論","由醫師單方面決定"],"a":2,"e":"正確答案為（C）。適當作法是理解家屬、確認病人的意願與能力，再共同討論告知方式。"},{"q":"本課程的 Clinical Pearl 是？","o":["病人優先，家屬不用管","家屬決定即可","先理解，再回應","立即告知最安全"],"a":2,"e":"正確答案為（C）。先理解家屬的顧慮，再回到病人的權益與意願，才有助於形成合宜回應。"},{"q":"下列何者正確？","o":["尊重病人自主等於不必理會家屬","家屬要求就一定不能告知病人","醫療人員應兼顧病人權益、家屬關懷與良好溝通","法律規定所有病情都必須立即告知"],"a":2,"e":"正確答案為（C）。臨床倫理重視病人權益，也理解家屬的關懷，並透過溝通尋找適合的做法。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

<script>
(()=>{const submit=document.getElementById('submit'),result=document.getElementById('res');if(!submit||!result||!window.PlatformAnalytics)return;submit.addEventListener('click',()=>{if(!result.textContent.includes('尚未完成'))PlatformAnalytics.track('quiz_complete',{course_id:'E4',series_id:'series_2'});});})();
</script>
