<div class="hero"><div>E18｜第二系列・臨床倫理情境案例</div><h1>倫理決定如何落實在照護中？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e18-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E18 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"醫療團隊完成倫理分析並形成照護方向後，下一步最適當的做法是什麼？","o":["將結論交給主治醫師自行執行","只需在病歷中記錄最後決定","將倫理建議轉化為具體的共同照護計畫","立即結束倫理討論，避免病人再次改變決定"],"a":2,"e":"正確答案為（C）。形成倫理結論並不代表倫理工作已經完成。醫療團隊還需要將有理由的選擇轉化為具體、可執行、可溝通及可追蹤的共同照護計畫，包括確認照護目標、具體措施、團隊分工與追蹤方式。"},{"q":"林女士的醫療團隊認為，在完善風險管理與術後照護的前提下，手術較可能符合她目前的照護目標。下列何者是團隊向林女士說明這項建議時，最重要的內容？","o":["多數團隊成員都贊成手術","醫院處理髖部骨折通常都採取手術","手術是唯一符合醫學倫理的選擇","說明手術如何回應她的照護目標，以及可能的利益、風險與限制"],"a":3,"e":"正確答案為（D）。倫理建議不能只以多數意見、醫院慣例或單一專業判斷作為理由。團隊應清楚說明病人的價值與目標、不同方案的利益與負擔，以及為什麼這項方案在目前情況下較適合這位病人。"},{"q":"下列哪一項內容最符合「共同照護計畫」的要求？","o":["只記錄病人最後接受哪一項治療","列出照護目標、具體措施、負責人員及追蹤方式","由醫師決定治療後，再通知其他團隊成員執行","要求家屬簽名，證明已經接受醫療團隊的安排"],"a":1,"e":"正確答案為（B）。共同照護計畫應回答四個問題：照護目標是什麼、具體要做什麼、由誰負責，以及如何確認成效。它不是單純記錄治療選項，也不是由單一專業人員決定後交由其他人執行。"},{"q":"林女士接受手術後，病情出現新的變化，而且她表示不希望繼續原定的復健安排。醫療團隊最適當的處理方式是什麼？","o":["依原計畫繼續執行，避免影響治療成效","認為林女士已經同意手術，因此不能再改變意願","重新評估病情、病人意願與照護目標，必要時調整計畫","請家屬說服林女士遵從原定安排"],"a":2,"e":"正確答案為（C）。照護計畫不是不可改變的固定命令。當病情、病人意願、治療效果或照護條件發生重要變化時，醫療團隊應重新評估，並依目前情況調整照護計畫。病人先前同意某項治療，也不代表之後不能重新表達意願。"},{"q":"下列哪一項最能說明「溝通、紀錄、交班與追蹤」在倫理決定落實過程中的重要性？","o":["主要目的是證明醫療團隊沒有法律責任","可以確保病人、家屬及不同專業人員理解並持續執行共同照護計畫","只要病歷紀錄完整，就不需要再向病人或家屬說明","倫理決定完成後，只有主治醫師需要知道相關內容"],"a":1,"e":"正確答案為（B）。共同照護計畫必須透過清楚溝通、完整紀錄、確實交班與持續追蹤，才能真正落實。病人、家屬及不同班別與專業人員都需要取得一致且必要的資訊。若資訊未被傳遞，再好的倫理決定也可能在照護過程中失落。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>
