<div class="hero"><div>E16｜第二系列・臨床倫理情境案例</div><h1>遇到倫理困境，第一步是什麼？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e16-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E16 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"面對林女士與家屬的不同意見，醫療團隊最適當的第一步為何？","o":["請兒子與女兒投票決定","立即請倫理委員會決定是否手術","先整理臨床事實，釐清決策者與不同立場重視的價值","只要醫師認為手術有益，就直接安排手術"],"a":2,"e":"正確答案為（C）。遇到倫理困境時，不應急著選擇某一方的答案。醫療團隊應先整理病情、預後、治療選項與急迫性，評估病人的決策能力，並辨識不同立場背後的價值，再將問題整理成可以共同討論的倫理問題。"},{"q":"關於林女士患有中度失智症，下列敘述何者正確？","o":["只要診斷失智症，就一定沒有決策能力","失智症病人的所有醫療決定都應由家屬代為決定","應針對當下這一項醫療決定，評估病人的決策能力","病人只要曾經改變說法，就不能參與決策"],"a":2,"e":"正確答案為（C）。決策能力應依特定決定及當下狀況進行評估。失智症、高齡或表達猶豫，本身都不等於病人一定沒有決策能力。團隊仍應評估病人是否能理解資訊、認識後果、比較方案並表達選擇。"},{"q":"如果疼痛與焦慮可能影響林女士的理解與表達，醫療團隊較適當的做法是什麼？","o":["立即認定病人沒有決策能力","直接由家屬取代病人決定","先處理可逆因素，再於適當時機重新評估","不再向病人說明，以免增加焦慮"],"a":2,"e":"正確答案為（C）。疼痛、焦慮、藥物作用或環境因素，都可能暫時影響病人的表現。若情況允許，應先處理這些可逆因素，再於適當時機重新評估病人的決策能力，而不是立即排除病人參與決策。"},{"q":"下列哪一項最適合作為本案例真正需要討論的倫理問題？","o":["兒子和女兒，誰比較有權作主？","手術與不手術，哪一個比較便宜？","如何說服林女士接受醫師建議？","在病人決策能力尚待釐清，而且手術利益與負擔並存時，如何形成符合病人意願與價值的醫療決定？"],"a":3,"e":"正確答案為（D）。清楚的倫理問題應呈現案例中的事實、不確定性及價值衝突，而不是預設某一方正確，或把問題簡化成家屬權力競爭。本案例的重點是如何形成以病人意願與價值為中心的決定。"},{"q":"本課程建議遇到倫理困境時，可以先從哪四個面向整理？","o":["法律、費用、家屬與醫院政策","事實、決策者、價值與真正的倫理問題","醫師、護理師、病人與家屬","自主、行善、不傷害與公平"],"a":1,"e":"正確答案為（B）。本課程提供的起始架構是：先整理事實、確認適當的決策者、辨識不同價值，最後說清楚真正需要回答的倫理問題。四項倫理原則可以協助後續分析，但在開始分析之前，仍需先將案例與問題整理清楚。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

<script>
(()=>{const submit=document.getElementById('submit'),result=document.getElementById('res');if(!submit||!result||!window.PlatformAnalytics)return;submit.addEventListener('click',()=>{if(!result.textContent.includes('尚未完成'))PlatformAnalytics.track('quiz_complete',{course_id:'E16',series_id:'series_2'});});})();
</script>
