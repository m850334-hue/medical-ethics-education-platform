<div class="hero"><div>E17｜第二系列・臨床倫理情境案例</div><h1>每個方案都有風險，該怎麼選？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e17-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E17 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"醫療團隊準備比較林女士接受手術與保守治療兩個方案。進行倫理分析前，最適當的第一步是什麼？","o":["立即選擇醫療風險最低的方案","由家屬投票決定採取哪一個方案","先釐清有哪些臨床上可行的方案及其具體內容","直接依照醫師最熟悉的治療方式處理"],"a":2,"e":"正確答案為（C）。比較方案之前，應先確認臨床上有哪些真正可行的選項、各方案的具體內容，以及需要哪些支持條件。如果方案本身尚未說清楚，就無法進行有意義的利益、負擔與倫理理由比較。"},{"q":"下列哪一項最符合「公平比較接受手術與保守治療」的做法？","o":["手術能改善病情，因此只需說明手術的利益","保守治療沒有侵入性，因此可視為沒有風險","分別說明兩個方案的可能利益、負擔與不確定性","只比較兩個方案各有多少項優點與缺點"],"a":2,"e":"正確答案為（C）。每個方案都可能同時具有利益、負擔及不確定性。接受手術可能改善疼痛與活動能力，但也有麻醉、術後譫妄及復健負擔；保守治療可以避免手術風險，但仍可能面臨疼痛、失能及長期臥床等問題。因此，兩個方案都應獲得完整而平衡的說明。"},{"q":"林女士表示：「我怕開刀，也怕痛，但我不想一直躺在床上。」比較治療方案時，最重要的倫理問題為何？","o":["哪個方案最符合多數家屬的期待","哪個方案最能回應林女士的價值與照護目標","哪個方案所需的醫療人力最少","哪個方案在醫院最常被採用"],"a":1,"e":"正確答案為（B）。倫理分析不能只比較醫療風險，也要了解不同治療結果對病人的意義。團隊應將林女士害怕手術與疼痛、希望避免長期臥床並恢復部分功能等價值與照護目標納入方案比較。"},{"q":"下列哪一項最不符合本課程所說的倫理分析方式？","o":["比較各方案的預期利益與可能負擔","評估方案在實際照護環境中是否可行","將四項倫理原則逐項計分，選擇總分最高的方案","了解病人最在意及最希望避免的結果"],"a":2,"e":"正確答案為（C）。倫理分析不是數學計分，也不是把倫理原則當成勾選表。不同利益與負擔對病人的重要程度並不相同。團隊需要說明各方案的倫理理由，並判斷哪一個方案較能回應這位病人的價值與照護目標。"},{"q":"關於臨床倫理分析，下列何者最正確？","o":["最好的方案應該完全沒有醫療風險","只要家屬意見一致，就不需要考慮病人的價值","選擇保守治療等於不再提供任何醫療照護","倫理分析是在各有利弊的方案中，找出較符合病人價值與照護目標的選擇"],"a":3,"e":"正確答案為（D）。臨床上通常不存在完全沒有風險的方案。倫理分析的目的，是在各個可行方案之間，比較預期利益、可能負擔、病人的價值、照護目標及實際可行性，形成具有理由、可以溝通且能夠執行的照護方向。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

(()=>{if(!window.PlatformAnalytics)return;PlatformAnalytics.track('quiz_complete',{course_id:'E17',series_id:'series_2',mode:'一般學習'});const formal=document.getElementById('f');formal?.addEventListener('click',()=>PlatformAnalytics.track('quiz_complete',{course_id:'E17',series_id:'series_2',mode:'正式測驗'}));})();
</script>
