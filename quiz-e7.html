<div class="hero"><div>E7｜第二系列・臨床倫理情境案例</div><h1>電話詢問病情，可以直接說嗎？｜課後測驗</h1><p>透過練習模式熟悉重點，或進入正式測驗檢核學習成果。</p><a href="course-e7-final.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #b9d2d3;border-radius:8px;background:white;color:#176f72;font-weight:bold;text-decoration:none">← 返回 E7 課程</a></div><main class="wrap"><div class="mode"><button id="l" class="active">一般學習｜選答即時解析</button><button id="f">正式測驗｜完成後公布結果</button></div><div id="list"></div><button id="submit" style="display:none">提交正式測驗</button><div id="res" class="result"></div></main>
<script>
const D=[{"q":"來電者能說出病人的姓名、病房及部分病況時，醫療人員最適當的作法是：","o":["直接告知完整病情","只要對方自稱家屬，就可以回答","先確認身分、病人意願及適當的資訊揭露範圍","一律拒絕任何回應"],"a":2,"e":"正確答案為（C）。知道姓名或病房不代表身分與授權已確認，仍須先核實再判斷可揭露範圍。"},{"q":"家屬在電話中表示非常焦急，希望立即知道檢查結果。醫療人員較適當的回應是：","o":["因為家屬很擔心，可以先透露部分病情","先回應家屬的焦急，再說明需要確認身分與授權","請家屬不要再打電話","立即將病歷內容逐項說明"],"a":1,"e":"正確答案為（B）。可以先同理家屬的焦急，但仍需確認身分、授權及病人的意願。"},{"q":"無法確認來電者身分時，下列哪一項作法最適當？","o":["直接掛斷電話","請對方自行向其他家屬打聽","告知病情，但要求對方不要轉述","說明暫時無法透露病情，並協助聯繫病房或主要聯絡人"],"a":3,"e":"正確答案為（D）。保護隱私不等於冷漠拒絕，仍可說明原因並提供安全的下一步協助。"},{"q":"下列哪一項最符合電話詢問病情時的倫理原則？","o":["直系親屬一定有權知道全部病情","所有電話詢問一律不得回應","應同時考量病人隱私、自主、身分確認及家屬需求","只要來電者態度誠懇，就可以提供資訊"],"a":2,"e":"正確答案為（C）。電話詢問不能一律回答或拒絕，需綜合考量病人權益、授權與家屬需求。"},{"q":"本案例最主要涉及哪一項病人權利？","o":["優先接受檢查的權利","自行選擇病房的權利","醫療資訊隱私與自主決定","免費取得所有醫療文件的權利"],"a":2,"e":"正確答案為（C）。病人有權決定誰可以知道病情，以及哪些醫療資訊可以被揭露。"}];
let formal=false;const list=document.getElementById('list'),l=document.getElementById('l'),f=document.getElementById('f'),s=document.getElementById('submit'),r=document.getElementById('res');
function render(){list.innerHTML=D.map((x,i)=>`<section class="q" id="q${i}"><h2>第${i+1}題　${x.q}</h2>${x.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join('')}<div class="exp">${x.e}</div><div class="fb"></div></section>`).join('')}render();
function clearAttempt(){document.querySelectorAll('input[type="radio"]').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));document.querySelectorAll('.exp').forEach(e=>e.style.display='none');document.querySelectorAll('.fb').forEach(e=>e.textContent='');r.style.display='none'}
l.onclick=()=>{formal=false;l.classList.add('active');f.classList.remove('active');s.style.display='none';clearAttempt()};f.onclick=()=>{formal=true;f.classList.add('active');l.classList.remove('active');s.style.display='inline-block';clearAttempt()};
list.onchange=e=>{if(!e.target.matches('input')||formal)return;const i=+e.target.name.slice(1),ok=+e.target.value===D[i].a,q=e.target.closest('.q');q.querySelector('.exp').style.display='block';q.querySelector('.fb').textContent=ok?'回答正確':'回答錯誤，請參考解析後再試一次。';q.querySelector('.fb').style.color=ok?'#287d58':'#b33'};
s.onclick=()=>{let score=0,miss=[];document.querySelectorAll('.q').forEach(q=>q.classList.remove('wrong'));D.forEach((x,i)=>{const e=document.querySelector(`input[name=q${i}]:checked`);if(!e)miss.push(i+1);else if(+e.value===x.a)score++;else document.getElementById('q'+i).classList.add('wrong')});r.style.display='block';r.innerHTML=miss.length?`<h2>尚未完成</h2><p>請先回答第 ${miss.join('、')} 題。</p>`:`<h2>測驗結果：${score}/${D.length} 題</h2><p>${score===D.length?'恭喜，已通過正式測驗。':'尚未通過；紅框題目為答錯題目，請重新作答。'}</p>`};
</script>

<script>
(()=>{if(!window.PlatformAnalytics)return;let generalRecorded=false,formalRecorded=false;const list=document.getElementById('list'),general=document.getElementById('l'),formal=document.getElementById('f');const record=mode=>PlatformAnalytics.track('quiz_complete',{course_id:'E7',series_id:'series_2',mode});list?.addEventListener('change',event=>{if(!event.target.matches('input[type=radio]'))return;if(window.formal&&!formalRecorded){formalRecorded=true;record('正式測驗')}else if(!window.formal&&!generalRecorded){generalRecorded=true;record('一般學習')}});general?.addEventListener('click',()=>{generalRecorded=false});formal?.addEventListener('click',()=>{formalRecorded=false});})();
</script>
